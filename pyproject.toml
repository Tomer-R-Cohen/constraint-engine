[project]
name = "constraint-engine"
version = "0.1.0"
description = "General constraint optimization engine for assignment problems (rostering, timetabling, placement) on OR-Tools CP-SAT, exposed as MCP tools for any MCP client."
requires-python = ">=3.12"
dependencies = [
    "ortools",
    "pandas",
    "openpyxl",
    "pydantic>=2",
    "mcp>=2.2",
]

[project.scripts]
constraint-engine-mcp = "constraint_engine.server:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
